plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.skyrecomp.quest'
    compileSdk 36
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId 'io.github.skyrecomp.quest'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.1.0-smoketest.3'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-std=c++17'
            }
        }
    }

    flavorDimensions += 'content'
    productFlavors {
        publicRuntime {
            dimension 'content'
        }
        personal {
            dimension 'content'
            resValue 'string', 'app_name', 'SkyRecomp Quest Personal Build'
            // The renderer needs Vulkan 1.3 (Quest 3 / 3S on Horizon OS with Android 14).
            minSdk 34
            versionName '0.2.0-engine.1'
            // The game runtime (android/engine) next to the player's own libskygame.so.
            externalNativeBuild {
                cmake {
                    arguments '-DSKYRECOMP_ENGINE=ON'
                    targets 'main'
                }
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def kind = variant.flavorName == 'personal' ? 'Personal' : 'SmokeTest'
            outputFileName = "SkyRecomp-Quest-${kind}-${variant.versionName}.apk"
        }
    }
}

// SDL3's Android package (Java activity + libSDL3.so + CMake package), pinned by checksum.
def sdlVersion = '3.4.20'
def sdlSha256 = '535320e58f3bd7235b3e15f940595cdeeb9b8c0aa6b3810ff127345e3567d4da'
def sdlDir = layout.buildDirectory.dir('sdl3').get().asFile
def sdlAar = new File(sdlDir, "SDL3-${sdlVersion}.aar")

tasks.register('fetchSdl3') {
    outputs.file(sdlAar)
    doLast {
        sdlDir.mkdirs()
        def zip = new File(sdlDir, 'sdl3-android.zip')
        new URL("https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL3-devel-${sdlVersion}-android.zip")
            .withInputStream { input -> zip.withOutputStream { it << input } }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        zip.eachByte(1 << 16) { bytes, n -> digest.update(bytes, 0, n) }
        if (digest.digest().encodeHex().toString() != sdlSha256) throw new GradleException('SDL3 download checksum mismatch')
        copy {
            from zipTree(zip)
            include "SDL3-${sdlVersion}.aar"
            into sdlDir
        }
    }
}
tasks.matching { it.name.startsWith('pre') && it.name.contains('Personal') && it.name.endsWith('Build') }
    .configureEach { dependsOn 'fetchSdl3' }

dependencies {
    personalImplementation files(sdlAar).builtBy('fetchSdl3')
    // Supplies both the Android OpenXR loader .so and its Prefab CMake package.
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
