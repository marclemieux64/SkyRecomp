name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/test_repository_hygiene.py
      - run: python tools/test_pe_no_cfg.py
      - run: pip install capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5
      - run: python tools/test_gen.py
      - run: python tools/test_build_game.py
