name: Quest smoke-test APK

on:
  push:
    tags:
      - 'quest-smoketest-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build ARM64 Quest APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install pinned Android toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.1.12297006' 'cmake;3.31.6'

      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease lintRelease

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee android/app/build/quest-badging.txt
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyRecomp-Quest-SmokeTest-${{ github.ref_name }}
          path: |
            ${{ steps.apk.outputs.path }}
            android/app/build/quest-badging.txt
            docs/QUEST-SMOKETEST.md
          if-no-files-found: error

      - name: Publish tagged pre-release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          name: SkyRecomp Quest smoke test ${{ github.ref_name }}
          body_path: docs/QUEST-SMOKETEST.md
          files: ${{ steps.apk.outputs.path }}
