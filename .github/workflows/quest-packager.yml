name: Quest personal packager

on:
  push:
    tags:
      - 'quest-packager-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-packager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build portable executable bundle
        shell: powershell
        run: tools/quest/build-packager.ps1

      - name: Test packaged executable
        shell: powershell
        run: |
          Expand-Archive build/quest-packager-release/SkyRecomp-Quest-Packager-Windows-x64.zip build/packager-test
          $test = Start-Process build/packager-test/SkyRecomp-Quest-Packager.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Packaged GUI self-test failed.' }

      - uses: actions/upload-artifact@v4
        with:
          name: SkyRecomp-Quest-Packager-Windows-x64
          path: build/quest-packager-release/SkyRecomp-Quest-Packager-Windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged pre-release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          body: |
            Windows portable personal APK builder. Extract the ZIP, then run
            `SkyRecomp-Quest-Packager.exe`. Game data remains on the player's PC.

            This is a packaging preview; the Quest game runtime is not playable yet.
          files: build/quest-packager-release/SkyRecomp-Quest-Packager-Windows-x64.zip
